<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#000000"><title>蒲公英 · 悬浮投影测试</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui}canvas{display:block;width:100%;height:100%;touch-action:none}.panel{position:fixed;left:12px;bottom:12px;background:#171717dd;border:1px solid #444;border-radius:12px;padding:12px;width:min(320px,calc(100vw - 24px));font-size:12px}.panel label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}.panel input{width:58%}.buttons{display:flex;gap:8px}.buttons button{flex:1;background:#333;color:white;border:1px solid #777;border-radius:7px;padding:9px;cursor:pointer}.hint{opacity:.6;font-size:11px;margin-top:7px}body.hide .panel{display:none}</style></head><body><canvas id="c"></canvas><div class="panel"><strong>45° 投影测试 · 单画面</strong><label>尺寸 <input id="size" type="range" min="0.4" max="1.7" step="0.05" value="1"></label><label>水平位置 <input id="posX" type="range" min="-0.8" max="0.8" step="0.02" value="0"></label><label>垂直位置 <input id="posY" type="range" min="-0.8" max="0.8" step="0.02" value="0"></label><label>转速 <input id="speed" type="range" min="0" max="1.6" step="0.05" value="0.35"></label><div class="buttons"><button id="full">全屏</button><button id="hide">隐藏控制</button></div><div class="hint">隐藏后双击画面可恢复控制。镜像方向可在网址后加 ?mirror=1 切换。</div></div><script>
const c=document.querySelector('#c'),ctx=c.getContext('2d');const $=id=>document.getElementById(id);let W,H,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const N=310, seeds=[];let rng=91;function rand(){rng=(rng*1664525+1013904223)>>>0;return rng/4294967296}const golden=Math.PI*(3-Math.sqrt(5));for(let i=0;i<N;i++){let y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),a=i*golden;seeds.push({x:r*Math.cos(a),y,z:r*Math.sin(a),len:.81+rand()*.25,alpha:.65+rand()*.35})}
function line(x1,y1,x2,y2,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function draw(t){const size=+$('size').value,speed=+$('speed').value;ctx.clearRect(0,0,W,H);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);const cx=W*(.5+ +$('posX').value*.45),cy=H*(.5- +$('posY').value*.45),R=Math.min(W,H)*.24*size,theta=t*.001*speed;const mirror=new URLSearchParams(location.search).get('mirror')==='1'?-1:1;ctx.save();ctx.translate(cx,cy);ctx.scale(mirror,1);const pts=seeds.map(s=>{const x=s.x*Math.cos(theta)+s.z*Math.sin(theta),z=-s.x*Math.sin(theta)+s.z*Math.cos(theta);return {...s,x,z}}).sort((a,b)=>a.z-b.z);ctx.globalCompositeOperation='screen';for(const p of pts){let k=1+p.z*.10,px=p.x*R*k,py=p.y*R*k,ex=px*(1.28+p.len*.16),ey=py*(1.28+p.len*.16);let a=(.22+.48*(p.z+1)/2)*p.alpha;line(px*.14,py*.14,px,py,`rgba(235,245,255,${a*.8})`,.55);const spread=R*.085;let ang=Math.atan2(py,px),tx=-Math.sin(ang),ty=Math.cos(ang);for(let j=-2;j<=2;j++){let f=j/2;line(px,py,ex+tx*spread*f,ey+ty*spread*f,`rgba(250,250,255,${a*.75})`,.48)}ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.beginPath();ctx.arc(ex,ey,Math.max(.4,R*.007),0,Math.PI*2);ctx.fill()}line(0,0,R*.04,R*.85,'rgba(240,230,215,.7)',1.6);const g=ctx.createRadialGradient(0,0,0,0,0,R*.2);g.addColorStop(0,'rgba(255,250,225,.8)');g.addColorStop(1,'rgba(255,250,225,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,R*.2,0,7);ctx.fill();ctx.restore();requestAnimationFrame(draw)}requestAnimationFrame(draw);
$('full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){alert('请使用浏览器菜单进入全屏')}};$('hide').onclick=()=>document.body.classList.add('hide');let last=0;c.addEventListener('pointerup',()=>{const now=Date.now();if(now-last<380)document.body.classList.remove('hide');last=now});
</script></body></html>
