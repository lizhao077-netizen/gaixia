<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>蒲公英 · 全息投影双模式测试</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#f2f2f2;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}canvas#view{display:block;width:100%;height:100%;touch-action:manipulation}#panel{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:12px;z-index:3;width:min(360px,calc(100vw - 24px));max-height:min(78vh,550px);overflow:auto;padding:14px 15px 12px;border:1px solid #45474c;border-radius:16px;background:rgba(16,17,22,.94);backdrop-filter:blur(12px);box-shadow:0 8px 36px #000b;font-size:12px}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px}.header small{font-size:11px;color:#98a0af}.tabs{display:flex;gap:6px;margin:9px 0 12px}.tabs button{flex:1}.tabs button.on{border-color:#c7d9ff;background:#34425c;color:#fff}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:7px 0}.row label{min-width:70px;color:#c5ccd5}.row input[type=range]{flex:1;min-width:0;accent-color:#c4d6fe}.row output{width:36px;text-align:right;font-variant-numeric:tabular-nums;color:#a8b6c6}.toggles{display:flex;gap:14px;margin:12px 0 10px;flex-wrap:wrap;color:#d3d7dd}.toggles label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{flex:1;min-width:26%}button{background:#272a32;border:1px solid #606777;color:#eee;border-radius:8px;padding:9px 7px;cursor:pointer;font-size:12px}button:active{transform:scale(.98)}.note{font-size:11px;color:#9ba2ab;line-height:1.6;margin:10px 0 0}#reopen{position:fixed;top:max(8px,env(safe-area-inset-top));right:8px;z-index:4;padding:8px 10px;display:none;background:#20242dcc;opacity:.55}.hidden-controls #panel{display:none}.hidden-controls #reopen{display:block;opacity:.10}.hidden-controls #reopen:focus,.hidden-controls #reopen:hover{opacity:1}#modeCaption{position:fixed;top:10px;left:10px;font-size:12px;color:#74808d;pointer-events:none;opacity:.6}.hidden-controls #modeCaption{display:none}@media(max-width:450px){#panel{padding:11px 12px;max-height:74vh}.row{margin:5px 0}}@media(orientation:landscape) and (max-height:500px){#panel{width:285px;max-height:calc(100vh - 20px);padding:9px 12px;font-size:11px}.header{font-size:12px;margin-bottom:4px}.tabs{margin:5px 0}.row{margin:3px 0}.note{margin-top:5px}.actions button{padding:6px 5px}}
</style>
</head>
<body>
<canvas id="view" aria-label="蒲公英全息投影画面"></canvas><div id="modeCaption">倒金字塔 · 四视图</div>
<section id="panel" aria-label="投影设置">
<div class="header"><strong>蒲公英 · 投影对照测试</strong><small>离线可运行</small></div>
<div class="tabs"><button type="button" id="pyramid" class="on">倒金字塔 · 四面</button><button type="button" id="single">单片45° · 一面</button></div>
<div class="row"><label for="scale">影像尺寸</label><input id="scale" type="range" min="0.35" max="1.55" step="0.05" value="0.85"><output id="scaleValue"></output></div>
<div class="row"><label for="offsetX">水平偏移</label><input id="offsetX" type="range" min="-0.7" max="0.7" step="0.02" value="0"><output id="offsetXValue"></output></div>
<div class="row"><label for="offsetY">垂直偏移</label><input id="offsetY" type="range" min="-0.7" max="0.7" step="0.02" value="0"><output id="offsetYValue"></output></div>
<div class="row"><label for="speed">旋转速度</label><input id="speed" type="range" min="0" max="1.6" step="0.05" value="0.35"><output id="speedValue"></output></div>
<div class="row" id="gapRow"><label for="gap">四面间距</label><input id="gap" type="range" min="0" max="0.22" step="0.01" value="0.07"><output id="gapValue"></output></div>
<div class="toggles"><label><input id="mirror" type="checkbox"> 左右镜像</label><label><input id="invert" type="checkbox"> 翻转四面朝向</label><label><input id="guide" type="checkbox"> 十字校准</label></div>
<div class="actions"><button id="fullscreen">全屏显示</button><button id="hide">隐藏控制</button><button id="reset">恢复默认</button></div>
<div class="note" id="hint">将倒金字塔小端对准屏幕十字中心，四面分别朝向四个画面。黑底、亮屏、关灯测试。隐藏后点右上角可恢复。</div>
</section>
<button type="button" id="reopen" aria-label="显示控制">⚙</button>
<script>
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('view'),ctx=canvas.getContext('2d',{alpha:false});
const off=document.createElement('canvas'),oc=off.getContext('2d',{alpha:false});
off.width=off.height=480;
let mode='pyramid', W=0,H=0,dpr=1,lastTime=performance.now(),spin=0;
const configs={pyramid:{scale:.85,offsetX:0,offsetY:0,speed:.35,gap:.07},single:{scale:1,offsetX:0,offsetY:0,speed:.35,gap:.07}};
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
let rng=7182;function rand(){rng=(Math.imul(rng,1664525)+1013904223)>>>0;return rng/4294967296}
const N=320,seeds=[],golden=Math.PI*(3-Math.sqrt(5));
for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),a=i*golden;seeds.push({x:r*Math.cos(a),y,z:r*Math.sin(a),length:.82+rand()*.28,opacity:.67+rand()*.33})}
function stroke(x1,y1,x2,y2,color,width){oc.beginPath();oc.moveTo(x1,y1);oc.lineTo(x2,y2);oc.strokeStyle=color;oc.lineWidth=width;oc.stroke()}
function renderFlower(angle,viewAngle){const C=240,R=102;oc.fillStyle='#000';oc.fillRect(0,0,480,480);
  oc.save();oc.translate(C,C+6);oc.globalCompositeOperation='screen';
  const phi=angle+viewAngle,ca=Math.cos(phi),sa=Math.sin(phi);
  const points=seeds.map(s=>({...s,xx:s.x*ca+s.z*sa,zz:-s.x*sa+s.z*ca})).sort((a,b)=>a.zz-b.zz);
  // Rotating world-space pappus, stalks and filament fan; four faces sample distinct camera bearings.
  for(const p of points){const zscale=1+.11*p.zz,x=p.xx*R*zscale,y=-p.y*R*zscale;
    const k=1.27+p.length*.12,ex=x*k,ey=y*k;
    const alpha=(.19+.62*(p.zz+1)/2)*p.opacity;
    stroke(x*.10,y*.10,x,y,`rgba(224,240,255,${alpha*.72})`,.57);
    const a=Math.atan2(y,x),ux=-Math.sin(a),uy=Math.cos(a);
    for(let j=-2;j<=2;j++){const s=j/2,spread=R*.075;stroke(x,y,ex+ux*spread*s,ey+uy*spread*s,`rgba(255,253,245,${alpha*.83})`,.56)}
    oc.beginPath();oc.arc(ex,ey,Math.max(.45,R*.008),0,2*Math.PI);oc.fillStyle=`rgba(255,254,248,${alpha})`;oc.fill();
  }
  stroke(0,0,6,92,'rgba(233,231,210,.68)',2);
  const halo=oc.createRadialGradient(0,0,0,0,0,26);halo.addColorStop(0,'rgba(255,242,198,.67)');halo.addColorStop(1,'rgba(255,242,198,0)');oc.fillStyle=halo;oc.beginPath();oc.arc(0,0,26,0,Math.PI*2);oc.fill();oc.restore();
}
function imageAt(cx,cy,side,rotation,viewAngle){renderFlower(spin,viewAngle);ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation+( $('invert').checked ? Math.PI : 0));ctx.scale($('mirror').checked?-1:1,1);ctx.drawImage(off,-side/2,-side/2,side,side);ctx.restore()}
function drawGuide(cx,cy,side,gap,tile){if(!$('guide').checked)return;ctx.save();ctx.strokeStyle='rgba(92,230,239,.78)';ctx.lineWidth=1;ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(cx-side*.5,cy);ctx.lineTo(cx+side*.5,cy);ctx.moveTo(cx,cy-side*.5);ctx.lineTo(cx,cy+side*.5);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='rgba(242,217,111,.9)';ctx.strokeRect(cx-gap/2,cy-gap/2,gap,gap);ctx.fillStyle='#9de3ef';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText('中心',cx,cy-8);ctx.restore()}
function draw(now){const dt=Math.min(.08,Math.max(0,(now-lastTime)/1000));lastTime=now;spin+=dt*(+$('speed').value)*.9;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const xOff=+$('offsetX').value, yOff=+$('offsetY').value;
  if(mode==='single'){
    const S=Math.min(W,H)*.83,px=W/2+xOff*W*.32,py=H/2-yOff*H*.32;
    imageAt(px,py,S*(+$('scale').value),0,0);
  } else {
    const S=Math.min(W,H)*.96,px=W/2+xOff*W*.32,py=H/2-yOff*H*.32;
    const gap=S*(+$('gap').value),tile=(S-gap)/3.05,delta=gap/2+tile;
    const flowerSide=tile*(+$('scale').value);
    // Four perspectives; each image's top points inward to the small centered aperture.
    imageAt(px,py-delta,flowerSide,Math.PI,Math.PI);
    imageAt(px,py+delta,flowerSide,0,0);
    imageAt(px-delta,py,flowerSide,Math.PI/2,-Math.PI/2);
    imageAt(px+delta,py,flowerSide,-Math.PI/2,Math.PI/2);
    drawGuide(px,py,S,gap,tile);
  }
  requestAnimationFrame(draw)
}
requestAnimationFrame(draw);
function setMode(next){if(mode===next)return;for(const key of ['scale','offsetX','offsetY','speed','gap'])configs[mode][key]=+$((key)).value;mode=next;for(const [k,v] of Object.entries(configs[mode]))$(k).value=v;
  $('pyramid').classList.toggle('on',mode==='pyramid');$('single').classList.toggle('on',mode==='single');$('gapRow').style.display=mode==='pyramid'?'flex':'none';$('invert').parentElement.style.display=mode==='pyramid'?'inline-flex':'none';$('guide').parentElement.style.display=mode==='pyramid'?'inline-flex':'none';$('modeCaption').textContent=mode==='pyramid'?'倒金字塔 · 四视图':'单片45° · 单视图';$('hint').textContent=mode==='pyramid'?'将倒金字塔小端对准屏幕十字中心，四面朝向四个画面。镜像与翻转可现场调整。':'单片反射罩模式：正对透明板观察；画面是完整的一份，不需要四份。';syncVals()}
function syncVals(){for(const key of ['scale','offsetX','offsetY','speed','gap'])$(key+'Value').textContent=(+$(key).value).toFixed(2)}
for(const key of ['scale','offsetX','offsetY','speed','gap'])$(key).addEventListener('input',syncVals);syncVals();
$('pyramid').onclick=()=>setMode('pyramid');$('single').onclick=()=>setMode('single');
$('hide').onclick=()=>document.body.classList.add('hidden-controls');$('reopen').onclick=()=>document.body.classList.remove('hidden-controls');
let lastTap=0;canvas.addEventListener('pointerup',()=>{const now=Date.now();if(now-lastTap<420)document.body.classList.toggle('hidden-controls');lastTap=now});
$('reset').onclick=()=>{for(const [k,v] of Object.entries(configs[mode]))$(k).value=k==='scale'?(mode==='pyramid'?.85:1):k==='speed'?.35:k==='gap'?.07:0;for(const k of ['mirror','invert','guide'])$(k).checked=false;syncVals()};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else alert('当前浏览器不支持网页全屏。可使用浏览器菜单“添加到主屏幕”后再打开。')}catch(e){alert('无法自动全屏，可用手机浏览器菜单或“添加到主屏幕”运行。')}};
// Keep controls legible if opened with optional mode query.
if(new URLSearchParams(location.search).get('mode')==='single')setMode('single');
</script>
</body>
</html>
